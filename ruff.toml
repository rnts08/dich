# Lint + format configuration.
#
# The CI workflow is intentionally disabled while the finishing work is in
# progress; .githooks/pre-commit runs these checks locally instead. Enable
# the hook once per clone with:
#   git config core.hooksPath .githooks
line-length = 88
target-version = "py312"   # minimum supported per README

[lint]
# Explicit and stable: pyflakes (F), the critical pycodestyle subsets
# (E4/E7/E9), import sorting (I) and bugbear (B). Ruff's *default* rule set
# grows across releases, so pin the selection to keep `ruff check .`
# reproducible for everyone.
select = ["E4", "E7", "E9", "F", "I", "B"]

[lint.per-file-ignores]
# tests/conftest.py must set the DICH_HOME / HF_* sandbox environment
# before anything else is imported; that is why imports come after code.
"tests/conftest.py" = ["E402"]
