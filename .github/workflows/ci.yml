name: ci

on:
  push:
    branches: [main]   # not tags: --follow-tags would otherwise run the same
                       # job twice for the commit the tag points at
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        # No mlx / faster-whisper / sounddevice: every model and audio import
        # in the codebase is lazy, so the suite runs without them. The
        # `model`-marked golden tests are deselected below — they need 8 GB
        # of weights and run locally. No `cache: pip` either: it requires a
        # requirements.txt/pyproject.toml to hash and saves ~10 s here.
        run: pip install -r requirements-dev.txt httpx pypdf python-docx striprtf numpy

      - name: Byte-compile every module
        run: python -m compileall -q dich dev

      - name: Unit tests
        run: pytest -m "not model" -q
